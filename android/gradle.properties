org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true

# Samsung A06 5G is ARM-only — skip x86/x86_64 emulator ABI (speeds up build, reduces APK size)
reactNativeArchitectures=arm64-v8a,armeabi-v7a

# Keep new architecture disabled — required for Expo 52 bare workflow
newArchEnabled=false

# Hermes JS engine — faster startup and lower memory on Android
hermesEnabled=true
