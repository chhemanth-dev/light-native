<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="coreGlow" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:0.6" />
    </radialGradient>
    
    <linearGradient id="bulbGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="filamentGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.8" />
    </linearGradient>
    
    <radialGradient id="lightBeam">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filters -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out"/>
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softShadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Background with subtle gradient -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" rx="225"/>
  
  <!-- Outer glow aura -->
  <circle cx="512" cy="420" r="320" fill="url(#lightBeam)" opacity="0.4"/>
  <circle cx="512" cy="420" r="280" fill="url(#coreGlow)" opacity="0.15" filter="url(#outerGlow)"/>
  
  <!-- Light rays emanating from bulb -->
  <g opacity="0.3" stroke="url(#bulbGrad)" stroke-width="3" fill="none">
    <line x1="512" y1="150" x2="512" y2="50" stroke-linecap="round"/>
    <line x1="680" y1="210" x2="760" y2="150" stroke-linecap="round"/>
    <line x1="780" y1="380" x2="880" y2="360" stroke-linecap="round"/>
    <line x1="344" y1="210" x2="264" y2="150" stroke-linecap="round"/>
    <line x1="244" y1="380" x2="144" y2="360" stroke-linecap="round"/>
  </g>
  
  <!-- Lightbulb glass envelope - main shape -->
  <g filter="url(#softShadow)">
    <!-- Glass body -->
    <ellipse cx="512" cy="380" rx="160" ry="200" fill="url(#bulbGrad)" opacity="0.95" filter="url(#innerGlow)"/>
    <ellipse cx="512" cy="380" rx="150" ry="188" fill="none" stroke="#93C5FD" stroke-width="4" opacity="0.3"/>
    
    <!-- Inner glow core -->
    <ellipse cx="512" cy="360" rx="100" ry="120" fill="url(#coreGlow)" opacity="0.8"/>
    <ellipse cx="512" cy="340" rx="60" ry="70" fill="#DBEAFE" opacity="0.6" filter="url(#innerGlow)"/>
    
    <!-- AI Neural network pattern inside -->
    <g stroke="#DBEAFE" stroke-width="2.5" fill="none" opacity="0.5">
      <!-- Central nodes -->
      <circle cx="512" cy="360" r="5" fill="#DBEAFE"/>
      <circle cx="470" cy="340" r="4" fill="#DBEAFE"/>
      <circle cx="554" cy="340" r="4" fill="#DBEAFE"/>
      <circle cx="480" cy="390" r="4" fill="#DBEAFE"/>
      <circle cx="544" cy="390" r="4" fill="#DBEAFE"/>
      <circle cx="512" cy="420" r="4" fill="#DBEAFE"/>
      
      <!-- Connections -->
      <line x1="512" y1="360" x2="470" y2="340" opacity="0.6"/>
      <line x1="512" y1="360" x2="554" y2="340" opacity="0.6"/>
      <line x1="512" y1="360" x2="480" y2="390" opacity="0.6"/>
      <line x1="512" y1="360" x2="544" y2="390" opacity="0.6"/>
      <line x1="470" y1="340" x2="480" y2="390" opacity="0.4"/>
      <line x1="554" y1="340" x2="544" y2="390" opacity="0.4"/>
      <line x1="480" y1="390" x2="512" y2="420" opacity="0.4"/>
      <line x1="544" y1="390" x2="512" y2="420" opacity="0.4"/>
    </g>
    
    <!-- Glowing filament -->
    <g filter="url(#innerGlow)">
      <path d="M 485 320 Q 500 300, 512 310 Q 524 300, 539 320" 
            stroke="url(#filamentGrad)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
      <path d="M 485 340 Q 498 360, 512 350 Q 526 360, 539 340" 
            stroke="url(#filamentGrad)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
    </g>
    
    <!-- Highlight reflections on glass -->
    <ellipse cx="450" cy="320" rx="30" ry="50" fill="#FFFFFF" opacity="0.15"/>
    <ellipse cx="440" cy="310" rx="15" ry="25" fill="#FFFFFF" opacity="0.25"/>
  </g>
  
  <!-- Bulb base/socket -->
  <g>
    <!-- Threaded base -->
    <rect x="462" y="560" width="100" height="30" rx="5" fill="#475569"/>
    <rect x="462" y="595" width="100" height="30" rx="5" fill="#3F4C5F"/>
    <rect x="462" y="630" width="100" height="30" rx="5" fill="#334155"/>
    
    <!-- Contact point -->
    <ellipse cx="512" cy="675" rx="35" ry="10" fill="#1E293B"/>
    <ellipse cx="512" cy="673" rx="28" ry="8" fill="#475569"/>
  </g>
  
  <!-- Voice wave indicator at bottom -->
  <g opacity="0.6" stroke="#60A5FA" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 380 780 Q 400 760, 420 780 Q 440 800, 460 780 Q 480 760, 500 780 Q 520 800, 540 780 Q 560 760, 580 780 Q 600 800, 620 780 Q 640 760, 644 780"/>
    <path d="M 400 820 Q 420 800, 440 820 Q 460 840, 480 820 Q 500 800, 520 820 Q 540 840, 560 820 Q 580 800, 600 820 Q 620 840, 624 820" opacity="0.4"/>
  </g>
  
  <!-- Subtle ambient particles -->
  <g fill="#60A5FA" opacity="0.3">
    <circle cx="320" cy="280" r="3"/>
    <circle cx="710" cy="320" r="2"/>
    <circle cx="380" cy="520" r="2.5"/>
    <circle cx="650" cy="480" r="2"/>
    <circle cx="290" cy="440" r="2.5"/>
    <circle cx="735" cy="420" r="3"/>
  </g>
  
  <!-- Brand name at bottom -->
  <text x="512" y="920" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" 
        fill="#60A5FA" text-anchor="middle" letter-spacing="18" opacity="0.8">LIGHT</text>
</svg>
