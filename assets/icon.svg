<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="180"/>
  
  <!-- Central AI Core - stylized lightbulb meets neural network -->
  <g filter="url(#shadow)">
    <!-- Outer glow ring -->
    <circle cx="512" cy="450" r="200" fill="none" stroke="url(#lightGradient)" stroke-width="3" opacity="0.3" filter="url(#glow)"/>
    <circle cx="512" cy="450" r="170" fill="none" stroke="url(#lightGradient)" stroke-width="2" opacity="0.2"/>
    
    <!-- Main bulb shape -->
    <path d="M 512 250 
             C 570 250, 620 290, 620 350
             C 620 390, 600 420, 575 445
             L 575 500
             C 575 515, 563 525, 550 525
             L 474 525
             C 461 525, 449 515, 449 500
             L 449 445
             C 424 420, 404 390, 404 350
             C 404 290, 454 250, 512 250 Z"
          fill="url(#lightGradient)" 
          filter="url(#glow)"/>
    
    <!-- Light rays -->
    <g opacity="0.6">
      <!-- Top ray -->
      <path d="M 512 180 L 512 230" stroke="url(#lightGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
      
      <!-- Top-right ray -->
      <path d="M 620 220 L 580 260" stroke="url(#lightGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
      
      <!-- Right ray -->
      <path d="M 680 350 L 630 350" stroke="url(#lightGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
      
      <!-- Top-left ray -->
      <path d="M 404 220 L 444 260" stroke="url(#lightGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
      
      <!-- Left ray -->
      <path d="M 344 350 L 394 350" stroke="url(#lightGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    </g>
    
    <!-- Filament - AI neural pattern -->
    <g opacity="0.8">
      <circle cx="512" cy="320" r="8" fill="#FFFFFF"/>
      <circle cx="490" cy="340" r="6" fill="#FFFFFF"/>
      <circle cx="534" cy="340" r="6" fill="#FFFFFF"/>
      <circle cx="512" cy="360" r="8" fill="#FFFFFF"/>
      <circle cx="490" cy="380" r="6" fill="#FFFFFF"/>
      <circle cx="534" cy="380" r="6" fill="#FFFFFF"/>
      
      <!-- Neural connections -->
      <line x1="512" y1="320" x2="490" y2="340" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
      <line x1="512" y1="320" x2="534" y2="340" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
      <line x1="490" y1="340" x2="512" y2="360" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
      <line x1="534" y1="340" x2="512" y2="360" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
      <line x1="512" y1="360" x2="490" y2="380" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
      <line x1="512" y1="360" x2="534" y2="380" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- Bulb base -->
    <rect x="474" y="525" width="76" height="25" rx="5" fill="#64748B"/>
    <rect x="484" y="550" width="56" height="20" rx="3" fill="#475569"/>
    
    <!-- Highlight on bulb -->
    <ellipse cx="470" cy="310" rx="35" ry="50" fill="#FFFFFF" opacity="0.15"/>
  </g>
  
  <!-- Bottom accent wave - representing voice/sound -->
  <g opacity="0.7">
    <path d="M 200 700 Q 312 660, 424 700 T 648 700 T 824 700" 
          stroke="url(#accentGradient)" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.6"/>
    <path d="M 250 740 Q 362 710, 474 740 T 698 740 T 774 740" 
          stroke="url(#accentGradient)" 
          stroke-width="4" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.4"/>
  </g>
  
  <!-- Subtle particles floating around -->
  <g opacity="0.3">
    <circle cx="350" cy="400" r="4" fill="#60A5FA"/>
    <circle cx="680" cy="450" r="3" fill="#A78BFA"/>
    <circle cx="300" cy="500" r="5" fill="#3B82F6"/>
    <circle cx="720" cy="380" r="4" fill="#8B5CF6"/>
    <circle cx="380" cy="280" r="3" fill="#60A5FA"/>
    <circle cx="640" cy="300" r="4" fill="#A78BFA"/>
  </g>
</svg>