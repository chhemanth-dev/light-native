name: Build APK with API Keys (DISABLED - Use build-apk.yml)

on:
  # Disabled automatic trigger to save minutes
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Aggressive)
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/node
          sudo apt-get clean
          docker system prune -a -f
          sudo rm -rf /home/runner/.gradle
          echo "After cleanup:"
          df -h

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Inject API Keys from Secrets
        run: |
          cat > src/config/init-api-keys.local.ts << 'EOF'
          /**
           * API KEYS - Injected from GitHub Secrets during build
           */
          import { setAPIKey } from '../lib/ai-providers';
          import { saveAPIKey } from './api-keys';

          export async function initializeMyAPIKeys() {
            console.log('[API Keys] Loading from GitHub Secrets...');
            
            // OpenAI API Key from GitHub Secret
            const openaiKey = '${{ secrets.OPENAI_API_KEY }}';
            setAPIKey('openai', openaiKey);
            await saveAPIKey('openai', openaiKey);
            
            console.log('[API Keys] ✅ Keys loaded and saved to storage');
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle (Optimized)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
          save-always: false
          
      - name: Clean Gradle Cache Before Build
        run: |
          rm -rf ~/.gradle/caches/transforms-*
          rm -rf ~/.gradle/caches/*/transforms
          rm -rf ~/.gradle/caches/*/generated
          rm -rf ~/.gradle/caches/build-cache-*
          df -h

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2
        env:
          JAVA_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

      - name: Get version info
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          
      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
          name: Light Native Release ${{ steps.version.outputs.date }}
          body: |
            🚀 **Light Native Android Release**
            
            Build from commit: `${{ github.sha }}`
            Date: ${{ steps.version.outputs.date }}
            
            **Latest Changes:**
            ${{ github.event.head_commit.message }}
            
            **Download:** `app-release.apk` below
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

